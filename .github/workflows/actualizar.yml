name: Actualizar RojoStats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: rojostats-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Actualizar Telegram e historial
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CANAL: ${{ secrets.CANAL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: Persistir la medición para la próxima hora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json historial.json
          git diff --cached --quiet || git commit -m "data: registrar medición horaria"
          git push
